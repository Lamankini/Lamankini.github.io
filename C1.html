<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>

<body>
    <p>Redirecting...</p>

    <script>
        /*
         * ==========================================
         * YOUR 2 AFFILIATE LINKS
         * ==========================================
         */
        const AFFILIATE_A = "https://limauwin.club/en/register?ref=12877528";
        const AFFILIATE_B = "https://limauwin.club/en/register?ref=49306995";

        /*
         * ==========================================
         * ROTATE EVERY 5 MINUTES
         * ==========================================
         */
        const FIVE_MINUTES = 5 * 60 * 1000;

        // Creates a global 5-minute time slot.
        const slot = Math.floor(Date.now() / FIVE_MINUTES);

        // Even slot = A, odd slot = B.
        const destination =
            slot % 2 === 0 ? AFFILIATE_A : AFFILIATE_B;

        /*
         * ==========================================
         * PRESERVE TRACKING PARAMETERS
         * ==========================================
         */
        const destinationUrl = new URL(destination);

        const incomingParams = new URLSearchParams(
            window.location.search
        );

        incomingParams.forEach((value, key) => {
            destinationUrl.searchParams.append(key, value);
        });

        /*
         * ==========================================
         * REDIRECT
         * ==========================================
         */
        window.location.replace(destinationUrl.toString());
    </script>
</body>
</html>

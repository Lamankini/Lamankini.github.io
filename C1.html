<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>

<body>
    <p>Redirecting...</p>

    <script>
        /*
         * ==========================================
         * ADD / CHANGE YOUR DESTINATIONS HERE
         * ==========================================
         */
        const DESTINATIONS = [
            "https://limauwin.club/en/register?ref=12877528",
            "https://limauwin.club/en/register?ref=49306995",
    
        ];

        /*
         * Randomly choose one destination
         */
        const destination =
            DESTINATIONS[Math.floor(Math.random() * DESTINATIONS.length)];

        /*
         * Preserve ALL incoming tracking parameters:
         * fbclid, utm_source, utm_medium,
         * utm_campaign, utm_content, gclid, etc.
         */
        const destinationUrl = new URL(destination);

        const incomingParams = new URLSearchParams(
            window.location.search
        );

        incomingParams.forEach((value, key) => {
            destinationUrl.searchParams.append(key, value);
        });

        /*
         * Redirect
         */
        window.location.replace(destinationUrl.toString());
    </script>
</body>
</html>
